name: One-shot low-density cooling patch

on:
  pull_request:
    branches:
      - codex/swiggum-shearing-box
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'codex/low-density-patch-trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/swiggum-shearing-box
          fetch-depth: 0

      - name: Apply low-density cooling patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old_lines, new_lines, label):
              text = path.read_text()
              old = "\n".join(old_lines)
              new = "\n".join(new_lines)
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly one match, found {count}")
              path.write_text(text.replace(old, new, 1))

          cpp = Path("src/LineCoolingData.cpp")
          replace_once(
              cpp,
              [
                  "// The explicit RHD line-cooling branch is used only between these two",
                  "// temperatures. The density limits span 10^-6 to 10^10 cm^-3; unusual values",
                  "// are evaluated by the direct solver instead of being extrapolated.",
              ],
              [
                  "// The explicit RHD line-cooling branch is used only between these two",
                  "// temperatures. The density grid spans 10^-6 to 10^10 cm^-3. Below the grid,",
                  "// use the low-density linear asymptote; unusual high densities are evaluated",
                  "// by the direct solver instead of being extrapolated.",
              ],
              "table-domain comment",
          )

          replace_once(
              cpp,
              [
                  "  if (!_is_valid || !(temperature >= LINE_COOLING_TABLE_MINIMUM_TEMPERATURE) ||",
                  "      !(temperature <= LINE_COOLING_TABLE_MAXIMUM_TEMPERATURE) ||",
                  "      !(electron_density >= LINE_COOLING_TABLE_MINIMUM_ELECTRON_DENSITY) ||",
                  "      !(electron_density <= LINE_COOLING_TABLE_MAXIMUM_ELECTRON_DENSITY)) {",
                  "    return _line_cooling_data.get_cooling(temperature, electron_density,",
                  "                                          abundances);",
                  "  }",
                  "",
              ],
              [
                  "  if (!_is_valid || !(temperature >= LINE_COOLING_TABLE_MINIMUM_TEMPERATURE) ||",
                  "      !(temperature <= LINE_COOLING_TABLE_MAXIMUM_TEMPERATURE) ||",
                  "      !(electron_density > 0.) ||",
                  "      !(electron_density <= LINE_COOLING_TABLE_MAXIMUM_ELECTRON_DENSITY)) {",
                  "    return _line_cooling_data.get_cooling(temperature, electron_density,",
                  "                                          abundances);",
                  "  }",
                  "",
                  "  // Below the table floor all of these collisionally excited lines are in",
                  "  // the low-density limit, so their cooling coefficients are linear in n_e.",
                  "  // Clamp only the interpolation coordinate to the table floor and scale the",
                  "  // result back down. This avoids feeding tiny densities to the level solver.",
                  "  const double table_electron_density = std::max(",
                  "      electron_density, LINE_COOLING_TABLE_MINIMUM_ELECTRON_DENSITY);",
                  "  const double low_density_scale =",
                  "      electron_density / table_electron_density;",
                  "",
              ],
              "low-density guard",
          )

          replace_once(
              cpp,
              [
                  "  const double density_coordinate =",
                  "      (std::log(electron_density) - minimum_log_density) /",
              ],
              [
                  "  const double density_coordinate =",
                  "      (std::log(table_electron_density) - minimum_log_density) /",
              ],
              "density interpolation coordinate",
          )

          replace_once(
              cpp,
              [
                  "    cooling += abundances[element] * coefficient;",
                  "  }",
                  "  return cooling;",
                  "}",
                  "",
                  "/**",
                  " * @brief Calculate the strength of all emission lines for which we have data.",
              ],
              [
                  "    cooling += abundances[element] * coefficient;",
                  "  }",
                  "  return low_density_scale * cooling;",
                  "}",
                  "",
                  "/**",
                  " * @brief Calculate the strength of all emission lines for which we have data.",
              ],
              "scaled table return",
          )

          test = Path("test/testLineCoolingData.cpp")
          replace_once(
              test,
              [
                  "  // The RHD line-cooling lookup table must accurately reproduce the direct",
                  "  // per-ion solver throughout its tabulated domain, and use that solver for",
                  "  // conditions outside the domain.",
              ],
              [
                  "  // The RHD line-cooling lookup table must accurately reproduce the direct",
                  "  // per-ion solver throughout its tabulated domain, use the low-density",
                  "  // asymptote below the density floor, and retain the direct solver outside",
                  "  // the temperature domain.",
              ],
              "table-test comment",
          )

          replace_once(
              test,
              [
                  "    const double direct = data.get_cooling(2000., 1.e8, abundances);",
                  "    const double tabulated = table.get_cooling(2000., 1.e8, abundances);",
                  "    assert_condition(direct == tabulated);",
              ],
              [
                  "    const double floor_cooling = table.get_cooling(10000., 1., abundances);",
                  "    const double subfloor_cooling =",
                  "        table.get_cooling(10000., 0.1, abundances);",
                  "    assert_values_equal_rel(0.1 * floor_cooling, subfloor_cooling, 1.e-13);",
                  "",
                  "    // Reproduce the numerical regime that motivated the guard. The result",
                  "    // can harmlessly underflow to zero, but it must remain finite.",
                  "    const double tiny_density_cooling =",
                  "        table.get_cooling(10000., 1.e-297, abundances);",
                  "    assert_condition(std::isfinite(tiny_density_cooling));",
                  "    assert_condition(tiny_density_cooling >= 0.);",
                  "",
                  "    const double direct = data.get_cooling(2000., 1.e8, abundances);",
                  "    const double tabulated = table.get_cooling(2000., 1.e8, abundances);",
                  "    assert_condition(direct == tabulated);",
              ],
              "low-density regression test",
          )

      - name: Check patch
        run: |
          git diff --check
          grep -q "return low_density_scale \* cooling;" src/LineCoolingData.cpp
          grep -q "table.get_cooling(10000., 1.e-297" test/testLineCoolingData.cpp

      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/LineCoolingData.cpp test/testLineCoolingData.cpp
          git commit -m "Use low-density asymptote below cooling table floor"
          git push origin HEAD:codex/swiggum-shearing-box
